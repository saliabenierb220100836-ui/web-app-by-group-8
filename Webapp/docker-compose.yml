version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: webapp_mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'webapp_db'
      MYSQL_USER: 'webapp_user'
      MYSQL_PASSWORD: 'webapp_password'
      MYSQL_ROOT_PASSWORD: 'root_password'
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: